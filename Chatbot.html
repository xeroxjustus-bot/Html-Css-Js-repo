<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Intelligent Responses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chatbot-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .chatbot-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chatbot-header h1 {
            flex: 1;
            margin: 0;
        }

        .api-provider-badge {
            background: rgba(255, 255, 255, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .api-status {
            background: #d4edda;
            color: #155724;
            padding: 10px 15px;
            font-size: 12px;
            text-align: center;
            border-bottom: 1px solid #c3e6cb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .api-status.error {
            background: #f8d7da;
            color: #721c24;
            border-bottom-color: #f5c6cb;
        }

        .token-info {
            font-size: 11px;
            opacity: 0.8;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 10px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
            animation: fadeIn 0.3s ease-out;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 2px;
        }

        .message-timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: right;
        }

        .user .message-timestamp {
            text-align: right;
        }

        .bot .message-timestamp {
            text-align: left;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .chatbot-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .chatbot-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chatbot-input:focus {
            border-color: #667eea;
        }

        .chatbot-send-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .chatbot-send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .chatbot-send-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .chatbot-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        .chatbot-messages::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        @media (max-width: 600px) {
            .chatbot-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .message-wrapper {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            <h1>🤖 AI Chat Assistant</h1>
            <div class="api-provider-badge" id="providerBadge">Google AI</div>
        </div>

        <div class="api-status" id="apiStatus">
            <span>✅ Ready to chat!</span>
            <span class="token-info" id="tokenInfo">Tokens: 0</span>
        </div>
        
        <div class="chatbot-messages" id="messagesContainer">
            <div class="message bot">
                <div class="message-wrapper">
                    <div class="message-content">
                        👋 Hello! I'm your AI assistant. Ask me anything and I'll provide accurate, contextual responses. What would you like to know?
                    </div>
                </div>
            </div>
        </div>

        <div class="chatbot-input-area">
            <input 
                type="text" 
                id="userInput" 
                class="chatbot-input" 
                placeholder="Type your message and press Enter..."
                autocomplete="off"
            >
            <button id="sendBtn" class="chatbot-send-btn">Send</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiStatus = document.getElementById('apiStatus');
        const tokenInfo = document.getElementById('tokenInfo');
        const providerBadge = document.getElementById('providerBadge');

        // State
        let chatHistory = [];
        let isWaitingForResponse = false;
        let totalTokensUsed = 0;
        
        // ⚠️ CONFIGURATION - CHOOSE YOUR API AND ADD YOUR KEY
        const API_CONFIG = {
            provider: 'google', // Change to 'openrouter' or 'google'
            openrouter_key: 'YOUR-OPENROUTER-API-KEY',
            google_key: 'YOUR-GOOGLE-AI-STUDIO-API-KEY'
        };

        // Check if API keys are properly configured
        function checkAPIConfig() {
            if (API_CONFIG.provider === 'google' && API_CONFIG.google_key === 'YOUR-GOOGLE-AI-STUDIO-API-KEY') {
                apiStatus.innerHTML = '<span>❌ Error: Please add your Google AI Studio API key</span>';
                apiStatus.classList.add('error');
                userInput.disabled = true;
                sendBtn.disabled = true;
                return false;
            }
            if (API_CONFIG.provider === 'openrouter' && API_CONFIG.openrouter_key === 'YOUR-OPENROUTER-API-KEY') {
                apiStatus.innerHTML = '<span>❌ Error: Please add your OpenRouter API key</span>';
                apiStatus.classList.add('error');
                userInput.disabled = true;
                sendBtn.disabled = true;
                return false;
            }
            updateProviderBadge();
            return true;
        }

        // Update provider badge
        function updateProviderBadge() {
            if (API_CONFIG.provider === 'google') {
                providerBadge.textContent = 'Google AI - Gemini';
            } else if (API_CONFIG.provider === 'openrouter') {
                providerBadge.textContent = 'OpenRouter';
            }
        }

        // Estimate token count
        function estimateTokens(text) {
            // Rough estimation: 1 token ≈ 4 characters
            return Math.ceil(text.length / 4);
        }

        // Update token display
        function updateTokenDisplay() {
            tokenInfo.textContent = `Tokens: ${totalTokensUsed}`;
        }

        // Display message in chat
        function displayMessage(text, sender, isStreaming = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'message-wrapper';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            contentDiv.id = isStreaming ? 'streamingMessage' : '';

            wrapperDiv.appendChild(contentDiv);
            messageDiv.appendChild(wrapperDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            return contentDiv;
        }

        // Stream text word by word (simulated token-by-token response)
        function streamText(element, text, speed = 30) {
            return new Promise((resolve) => {
                const words = text.split(' ');
                let index = 0;
                element.textContent = '';

                function addWord() {
                    if (index < words.length) {
                        if (element.textContent === '') {
                            element.textContent = words[index];
                        } else {
                            element.textContent += ' ' + words[index];
                        }
                        index++;
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        setTimeout(addWord, speed);
                    } else {
                        resolve();
                    }
                }

                addWord();
            });
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingIndicator';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';

            messageDiv.appendChild(typingDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Call Google AI Studio (Gemini) API with streaming
        async function callGoogleAI(message) {
            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_CONFIG.google_key}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: message
                                }]
                            }],
                            generationConfig: {
                                temperature: 0.7,
                                topP: 0.95,
                                topK: 40,
                                maxOutputTokens: 1024,
                            }
                        })
                    }
                );

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'Google AI API Error');
                }

                const data = await response.json();
                const responseText = data.candidates[0].content.parts[0].text;
                
                // Count tokens
                const inputTokens = estimateTokens(message);
                const outputTokens = estimateTokens(responseText);
                totalTokensUsed += inputTokens + outputTokens;
                updateTokenDisplay();

                return responseText;
            } catch (error) {
                console.error('Google AI Error:', error);
                return `❌ Error: ${error.message}`;
            }
        }

        // Call OpenRouter API with streaming
        async function callOpenRouter(message) {
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_CONFIG.openrouter_key}`,
                        'HTTP-Referer': window.location.href
                    },
                    body: JSON.stringify({
                        model: 'openrouter/auto',
                        messages: chatHistory.map(msg => ({
                            role: msg.role,
                            content: msg.content
                        })).concat([{
                            role: 'user',
                            content: message
                        }]),
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'OpenRouter API Error');
                }

                const data = await response.json();
                const responseText = data.choices[0].message.content;

                // Count tokens
                const inputTokens = data.usage.prompt_tokens;
                const outputTokens = data.usage.completion_tokens;
                totalTokensUsed += inputTokens + outputTokens;
                updateTokenDisplay();

                return responseText;
            } catch (error) {
                console.error('OpenRouter Error:', error);
                return `❌ Error: ${error.message}`;
            }
        }

        // Get AI response based on selected provider
        async function getAIResponse(userMessage) {
            if (API_CONFIG.provider === 'google') {
                return await callGoogleAI(userMessage);
            } else if (API_CONFIG.provider === 'openrouter') {
                return await callOpenRouter(userMessage);
            } else {
                return '❌ Invalid API provider selected';
            }
        }

        // Send message to chat
        async function sendMessage() {
            const message = userInput.value.trim();

            if (!message || isWaitingForResponse) {
                return;
            }

            // Display user message
            displayMessage(message, 'user');
            chatHistory.push({ role: 'user', content: message });

            // Count user message tokens
            totalTokensUsed += estimateTokens(message);
            updateTokenDisplay();

            // Clear input
            userInput.value = '';
            userInput.focus();

            // Update state
            isWaitingForResponse = true;
            sendBtn.disabled = true;

            // Show typing indicator
            showTypingIndicator();
            apiStatus.innerHTML = '<span>🔄 Processing your request...</span>';

            try {
                // Get AI response
                const aiResponse = await getAIResponse(message);
                
                // Remove typing indicator
                removeTypingIndicator();
                
                // Display response with streaming effect
                const messageContent = displayMessage('', 'bot', true);
                await streamText(messageContent, aiResponse, 20);
                
                chatHistory.push({ role: 'bot', content: aiResponse });
            } catch (error) {
                removeTypingIndicator();
                displayMessage(`❌ Error: ${error.message}`, 'bot');
            }

            // Reset state
            isWaitingForResponse = false;
            sendBtn.disabled = false;
            apiStatus.innerHTML = `<span>✅ Ready</span><span class="token-info" id="tokenInfo">Tokens: ${totalTokensUsed}</span>`;
            userInput.focus();
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isWaitingForResponse) {
                sendMessage();
            }
        });

        // Initialize on page load
        window.addEventListener('load', () => {
            checkAPIConfig();
            userInput.focus();
        });
    </script>
</body>
</html>
