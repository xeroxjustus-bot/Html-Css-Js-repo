<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chatbot-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .chatbot-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 2px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chatbot-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .chatbot-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chatbot-input:focus {
            border-color: #667eea;
        }

        .chatbot-send-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .chatbot-send-btn:hover {
            transform: translateY(-2px);
        }

        .chatbot-send-btn:active {
            transform: scale(0.98);
        }

        .chatbot-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        .chatbot-messages::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        @media (max-width: 600px) {
            .chatbot-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            💬 AI Chatbot
        </div>
        
        <div class="chatbot-messages" id="messagesContainer">
            <div class="message bot">
                <div class="message-content">
                    👋 Hello! I'm your AI assistant. How can I help you today?
                </div>
            </div>
        </div>

        <div class="chatbot-input-area">
            <input 
                type="text" 
                id="userInput" 
                class="chatbot-input" 
                placeholder="Type your message..."
                autocomplete="off"
            >
            <button id="sendBtn" class="chatbot-send-btn">Send</button>
        </div>
    </div>

    <script>
        // Get DOM elements
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Initialize chat history
        let chatHistory = [];
        let isWaitingForResponse = false;

        // AI Response Database
        const botResponses = {
            greeting: [
                "Hello! How can I assist you?",
                "Hi there! What can I help you with?",
                "Hey! What's up?",
                "Greetings! How may I help?"
            ],
            farewell: [
                "Goodbye! See you later!",
                "Take care! Come back anytime!",
                "See you soon!",
                "Bye! Have a great day!"
            ],
            question: [
                "That's a great question! Let me think...",
                "Interesting question! Here's what I think...",
                "Good point! I'd say...",
                "That's something to consider..."
            ],
            default: [
                "I appreciate your message! Can you tell me more?",
                "That's interesting! Tell me more about it.",
                "Got it! What else would you like to know?",
                "I see. Is there anything else I can help with?",
                "Thanks for sharing! Any other questions?"
            ],
            help: [
                "I can answer questions, have conversations, and help with various topics. Just ask me anything!",
                "I'm here to chat and help! You can ask me about pretty much anything.",
                "Feel free to ask me anything you want. I'm here to help!"
            ],
            time: [
                "I don't have access to the current time, but you can check your device!",
                "Let me know what time-related question you have!"
            ],
            name: [
                "I'm your AI Chatbot! You can call me whatever you'd like.",
                "I'm an AI Assistant here to chat with you!"
            ]
        };

        // Function to detect intent
        function detectIntent(message) {
            const lowerMessage = message.toLowerCase();

            // Greeting patterns
            if (/^(hi|hello|hey|greetings|sup)\b/.test(lowerMessage)) {
                return 'greeting';
            }

            // Farewell patterns
            if (/(bye|goodbye|see you|farewell|exit|quit)\b/.test(lowerMessage)) {
                return 'farewell';
            }

            // Help patterns
            if (/(help|what can you|what do you do|capabilities)\b/.test(lowerMessage)) {
                return 'help';
            }

            // Question patterns
            if (/(\?|what|why|how|who|when|where)/.test(lowerMessage)) {
                return 'question';
            }

            // Name patterns
            if (/(your name|who are you|what's your name|what is your name)/.test(lowerMessage)) {
                return 'name';
            }

            // Time patterns
            if (/(time|what time|current time|clock)/.test(lowerMessage)) {
                return 'time';
            }

            return 'default';
        }

        // Function to get bot response
        function getBotResponse(message) {
            const intent = detectIntent(message);
            const responses = botResponses[intent] || botResponses['default'];
            return responses[Math.floor(Math.random() * responses.length)];
        }

        // Function to display message
        function displayMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);

            // Auto scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Function to show typing indicator
        function showTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingIndicator';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';

            messageDiv.appendChild(typingDiv);
            messagesContainer.appendChild(messageDiv);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Function to remove typing indicator
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Function to handle sending message
        function sendMessage() {
            const message = userInput.value.trim();

            if (!message || isWaitingForResponse) return;

            // Display user message
            displayMessage(message, 'user');
            chatHistory.push({ role: 'user', message });

            // Clear input
            userInput.value = '';
            userInput.focus();

            // Disable send button
            isWaitingForResponse = true;
            sendBtn.disabled = true;

            // Show typing indicator
            showTypingIndicator();

            // Simulate API delay
            setTimeout(() => {
                removeTypingIndicator();

                // Get and display bot response
                const botResponse = getBotResponse(message);
                displayMessage(botResponse, 'bot');
                chatHistory.push({ role: 'bot', message: botResponse });

                // Re-enable send button
                isWaitingForResponse = false;
                sendBtn.disabled = false;
                userInput.focus();
            }, 1000);
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
