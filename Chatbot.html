<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot with Real API Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chatbot-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .chatbot-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .api-status {
            background: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            font-size: 12px;
            text-align: center;
            border-bottom: 1px solid #ffeaba;
        }

        .api-status.success {
            background: #d4edda;
            color: #155724;
            border-bottom-color: #c3e6cb;
        }

        .api-status.error {
            background: #f8d7da;
            color: #721c24;
            border-bottom-color: #f5c6cb;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 2px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chatbot-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .chatbot-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            min-width: 0;
        }

        .chatbot-input:focus {
            border-color: #667eea;
        }

        .api-key-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 12px;
            outline: none;
        }

        .api-key-input:focus {
            border-color: #667eea;
        }

        .chatbot-send-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .chatbot-send-btn:hover {
            transform: translateY(-2px);
        }

        .chatbot-send-btn:active {
            transform: scale(0.98);
        }

        .chatbot-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .api-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .api-btn {
            padding: 6px 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .api-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .api-btn:hover {
            border-color: #667eea;
        }

        .chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        .chatbot-messages::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        @media (max-width: 600px) {
            .chatbot-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .input-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            🔍 AI Search Chatbot
        </div>

        <div class="api-status" id="apiStatus">
            ⚙️ Setup API Keys to get started
        </div>
        
        <div class="chatbot-messages" id="messagesContainer">
            <div class="message bot">
                <div class="message-content">
                    👋 Hello! I'm your AI search assistant. Configure an API key below and ask me anything. I'll search the web and provide you with accurate, real-time information!
                </div>
            </div>
        </div>

        <div class="chatbot-input-area">
            <div style="width: 100%; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                <label style="font-size: 12px; font-weight: bold;">Select API:</label>
                <div class="api-selector">
                    <button class="api-btn active" data-api="google">Google Search</button>
                    <button class="api-btn" data-api="openai">OpenAI</button>
                </div>
            </div>
            
            <div class="input-row">
                <input 
                    type="password" 
                    id="apiKeyInput" 
                    class="api-key-input" 
                    placeholder="Paste your API key here..."
                    autocomplete="off"
                >
                <button id="setApiBtn" class="chatbot-send-btn" style="padding: 8px 15px; font-size: 12px;">Set API</button>
            </div>

            <div class="input-row">
                <input 
                    type="text" 
                    id="userInput" 
                    class="chatbot-input" 
                    placeholder="Search or ask anything..."
                    autocomplete="off"
                    disabled
                >
                <button id="sendBtn" class="chatbot-send-btn" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const setApiBtn = document.getElementById('setApiBtn');
        const apiStatus = document.getElementById('apiStatus');
        const apiButtons = document.querySelectorAll('.api-btn');

        // State
        let chatHistory = [];
        let isWaitingForResponse = false;
        let selectedAPI = 'google';
        let apiKey = '';

        // API Selection
        apiButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                apiButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedAPI = btn.dataset.api;
                updateApiStatus();
            });
        });

        // Set API Key
        setApiBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showApiStatus('❌ Please enter an API key', 'error');
                return;
            }
            apiKey = key;
            apiKeyInput.value = '';
            userInput.disabled = false;
            sendBtn.disabled = false;
            showApiStatus(`✅ ${selectedAPI === 'google' ? 'Google Search' : 'OpenAI'} API configured successfully!`, 'success');
        });

        function updateApiStatus() {
            if (apiKey) {
                showApiStatus(`✅ Using ${selectedAPI === 'google' ? 'Google Search' : 'OpenAI'} API`, 'success');
            }
        }

        function showApiStatus(message, type = 'info') {
            apiStatus.textContent = message;
            apiStatus.className = `api-status ${type}`;
        }

        // Display message
        function displayMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingIndicator';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';

            messageDiv.appendChild(typingDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Search using Google Custom Search API
        async function searchGoogle(query) {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(query)}&key=${apiKey}&cx=YOUR_SEARCH_ENGINE_ID`
                );
                
                if (!response.ok) {
                    throw new Error('Google API Error');
                }

                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const result = data.items[0];
                    return `🔍 Found: ${result.title}\n\n${result.snippet}\n\n📎 Source: ${result.link}`;
                } else {
                    return "Sorry, I couldn't find any results for that search.";
                }
            } catch (error) {
                console.error('Google Search Error:', error);
                return `❌ Google Search Error: ${error.message}. Make sure you have set up Google Custom Search API with a valid Search Engine ID.`;
            }
        }

        // Search using OpenAI API
        async function searchOpenAI(query) {
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a helpful search assistant. Provide accurate, concise, and relevant information in response to user queries.'
                            },
                            {
                                role: 'user',
                                content: query
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'OpenAI API Error');
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('OpenAI Error:', error);
                return `❌ OpenAI Error: ${error.message}. Please check your API key and try again.`;
            }
        }

        // Generate response based on selected API
        async function generateResponse(message) {
            try {
                if (selectedAPI === 'google') {
                    return await searchGoogle(message);
                } else if (selectedAPI === 'openai') {
                    return await searchOpenAI(message);
                }
            } catch (error) {
                return `Error: ${error.message}`;
            }
        }

        // Send message
        async function sendMessage() {
            const message = userInput.value.trim();

            if (!message || isWaitingForResponse || !apiKey) {
                if (!apiKey) {
                    showApiStatus('❌ Please set up an API key first', 'error');
                }
                return;
            }

            displayMessage(message, 'user');
            chatHistory.push({ role: 'user', message });

            userInput.value = '';
            userInput.focus();

            isWaitingForResponse = true;
            sendBtn.disabled = true;

            showTypingIndicator();
            showApiStatus(`🔍 Searching using ${selectedAPI === 'google' ? 'Google Search' : 'OpenAI'}...`, 'info');

            const botResponse = await generateResponse(message);
            
            removeTypingIndicator();
            displayMessage(botResponse, 'bot');
            chatHistory.push({ role: 'bot', message: botResponse });

            isWaitingForResponse = false;
            sendBtn.disabled = false;
            showApiStatus(`✅ Using ${selectedAPI === 'google' ? 'Google Search' : 'OpenAI'} API`, 'success');
            userInput.focus();
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isWaitingForResponse && apiKey) {
                sendMessage();
            }
        });
    </script>
</body>
</html>
