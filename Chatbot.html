<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot with Real API Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chatbot-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .chatbot-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .api-status {
            background: #d4edda;
            color: #155724;
            padding: 10px 15px;
            font-size: 12px;
            text-align: center;
            border-bottom: 1px solid #c3e6cb;
        }

        .api-status.error {
            background: #f8d7da;
            color: #721c24;
            border-bottom-color: #f5c6cb;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 2px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chatbot-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .chatbot-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chatbot-input:focus {
            border-color: #667eea;
        }

        .chatbot-send-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .chatbot-send-btn:hover {
            transform: translateY(-2px);
        }

        .chatbot-send-btn:active {
            transform: scale(0.98);
        }

        .chatbot-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chatbot-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chatbot-messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        .chatbot-messages::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        @media (max-width: 600px) {
            .chatbot-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            🔍 AI Search Chatbot
        </div>

        <div class="api-status" id="apiStatus">
            ✅ API Configured - Ready to search!
        </div>
        
        <div class="chatbot-messages" id="messagesContainer">
            <div class="message bot">
                <div class="message-content">
                    👋 Hello! I'm your AI search assistant. Ask me anything and I'll search the web for real-time information!
                </div>
            </div>
        </div>

        <div class="chatbot-input-area">
            <input 
                type="text" 
                id="userInput" 
                class="chatbot-input" 
                placeholder="Search or ask anything..."
                autocomplete="off"
            >
            <button id="sendBtn" class="chatbot-send-btn">Send</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiStatus = document.getElementById('apiStatus');

        // State
        let chatHistory = [];
        let isWaitingForResponse = false;
        
        // ⚠️ REPLACE WITH YOUR OWN API KEY
        const OPENAI_API_KEY = 'sk-YOUR-API-KEY-HERE';
        const GOOGLE_SEARCH_ENGINE_ID = 'YOUR-SEARCH-ENGINE-ID';
        const GOOGLE_API_KEY = 'YOUR-GOOGLE-API-KEY';

        // Check if API keys are set
        function checkAPIKeys() {
            if (OPENAI_API_KEY === 'sk-YOUR-API-KEY-HERE') {
                apiStatus.textContent = '❌ Error: Please add your OpenAI API key to the code (line 146)';
                apiStatus.classList.add('error');
                userInput.disabled = true;
                sendBtn.disabled = true;
                return false;
            }
            return true;
        }

        // Display message
        function displayMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingIndicator';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';

            messageDiv.appendChild(typingDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Search using OpenAI API
        async function searchWithOpenAI(query) {
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a helpful search assistant. Provide accurate, concise, and relevant information in response to user queries.'
                            },
                            {
                                role: 'user',
                                content: query
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'OpenAI API Error');
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('OpenAI Error:', error);
                return `❌ Error: ${error.message}`;
            }
        }

        // Generate response
        async function generateResponse(message) {
            try {
                return await searchWithOpenAI(message);
            } catch (error) {
                return `Error: ${error.message}`;
            }
        }

        // Send message
        async function sendMessage() {
            const message = userInput.value.trim();

            if (!message || isWaitingForResponse) {
                return;
            }

            displayMessage(message, 'user');
            chatHistory.push({ role: 'user', message });

            userInput.value = '';
            userInput.focus();

            isWaitingForResponse = true;
            sendBtn.disabled = true;

            showTypingIndicator();
            apiStatus.textContent = '🔍 Searching...';

            const botResponse = await generateResponse(message);
            
            removeTypingIndicator();
            displayMessage(botResponse, 'bot');
            chatHistory.push({ role: 'bot', message: botResponse });

            isWaitingForResponse = false;
            sendBtn.disabled = false;
            apiStatus.textContent = '✅ Ready for next search';
            userInput.focus();
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isWaitingForResponse) {
                sendMessage();
            }
        });

        // Check API keys on load
        window.addEventListener('load', () => {
            checkAPIKeys();
            userInput.focus();
        });
    </script>
</body>
</html>
